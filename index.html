<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PoyoDash">
  <title>PoyoDash!</title>

  <style>
    :root { --bg:#0e1424; --fg:#e8ecf8; --accent:#ff6a3d; }
    * { box-sizing: border-box; }

    html, body {
      margin: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, system-ui, sans-serif;
      overscroll-behavior: none;
    }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: env(safe-area-inset-top, 0px) 10px env(safe-area-inset-bottom, 0px);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    canvas {
      display: block; width: 100%; max-width: 900px; max-height: 70dvh;
      height: auto; aspect-ratio: 8 / 3; object-fit: contain;
      background: #141c33; border-radius: 8px; image-rendering: pixelated;
    }
    .btns { display: flex; gap: 12px; width: 100%; max-width: 900px; margin-top: 10px; }
    .btns button {
      flex: 1; font-size: 20px; font-weight: 700; padding: 14px 0;
      border: 0; border-radius: 12px; background: var(--accent); color: white;
      touch-action: none;
    }
    .btns button:active { filter: brightness(0.8); }
  </style>
</head>

<body>
  <canvas id="c" width="800" height="300"></canvas>
  <div class="btns">
    <button id="jumpBtn">JUMP</button>
    <button id="duckBtn">DUCK</button>
  </div>

  <script>
    // =====================================
    // CANVAS
    // =====================================
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const W = 800, H = 300, GROUND = 250;
    ctx.imageSmoothingEnabled = false;

    // =====================================
    // SETTINGS YOU WILL TWEAK
    // =====================================
    const GAME_NAME = 'PoyoDash!';

    // Frames in each sprite sheet (frame width is worked out automatically)
    const RUN_FRAMES        = 8;
    const JUMP_FRAMES       = 1;   // 1 = single pose
    const HORNET_FRAMES     = 3;
    const GROUND_OBS_FRAMES = 6;

    // true  = the 6 ground frames are an animation that loops
    // false = the 6 frames are 6 different obstacles (one is picked at random)
    const GROUND_OBS_ANIMATED = true;

    const RUN_FRAME_DURATION    = 130;  // ms per run frame (bigger = slower legs)
    const HORNET_FRAME_DURATION = 120;  // ms per wasp frame
    const GROUND_FRAME_DURATION = 120;  // ms per ground obstacle frame

    // On-screen sizes (px on the 800x300 canvas)
    const SPRITE_HEIGHT          = 140; // Poyo's height
    const HORNET_DRAW_HEIGHT     = 140; // wasp size (bigger number = bigger wasp)
    const GROUND_OBS_DRAW_HEIGHT = 85;
    const HORNET_Y_NUDGE         = 30;  // moves the wasp picture UP (bigger = higher)

    // Crouch squish (applied to hero_crouch.png)
    const CROUCH_SQUASH_Y  = 0.6;  // 1 = no squish, lower = flatter
    const CROUCH_STRETCH_X = 1.1;  // slightly wider while ducking

    // Poyo box sizes (the hitbox is these sizes MINUS the insets below)
    const STAND_H = 105, DUCK_H = 65, PLAYER_W = 55;

    // HITBOX SHRINK: pixels trimmed off each side. Bigger number = more forgiving.
    const PLAYER_INSET = { x: 14, top: 16, bottom: 4 };
    const OBS_INSET    = { x: 12, top: 10, bottom: 6 };   // ground obstacles
    const AIR_INSET    = { x: 18, top: 14, bottom: 8 };   // wasp

    // ----- TITLE SCREEN -----
    // The WHOLE logo.png is drawn (no cropping), so nothing can be cut off.
    const LOGO_W = 560;            // width of the whole image on screen (artwork is ~85% of this)
    const LOGO_CENTER_Y = 105;     // where the artwork's middle sits (0 = top of canvas, 300 = bottom)
    const LOGO_ART_CENTER = 0.49;  // where the artwork's middle is inside logo.png (0 = top edge, 1 = bottom edge)

    // true = black pixels in the logo vanish (for a logo on a black background).
    // If your logo has a transparent background, set this to false.
    const LOGO_BLEND_SCREEN = true;

    const TITLE_POYO_H = 90;        // size of the little running Poyo
    const TITLE_POYO_X = 70;        // his horizontal position (center)
    const TITLE_SCROLL_SPEED = 1.2; // how fast the title background drifts

    // Press H while playing to show/hide hitboxes (red = Poyo, yellow = obstacles)
    let showHitboxes = false;

    // Darken the background so sprites stand out (0 = off, 0.5 = quite dark)
    const BG_DIM = 0.35;
    const BG_SPEED = 0.3;               // background parallax (lower = farther away)

    // =====================================
    // ART (missing files are fine: placeholders are used)
    // =====================================
    function load(src) { const i = new Image(); i.src = src; return i; }
    const art = {
      run:    load('assets/hero_run.png'),
      jump:   load('assets/hero_jump.png'),
      crouch: load('assets/hero_crouch.png'),
      hornet: load('assets/hornet.png'),
      ground: load('assets/obstacle_ground.png'),
      bg:     load('assets/city_bg.png'),
      logo:   load('assets/logo.png'),
    };
    const ready = img => img.complete && img.naturalWidth > 0;

    // =====================================
    // GAME VARIABLES
    // =====================================
    let state, player, obstacles, speed, distance, nextGap, score;
    let best = 0, lastT = 0;
    let runAnimationTime = 0, animTime = 0;
    let scrollPos = 0;   // visual scroll for background + ground (never resets, so no snapping)

    try { best = Number(localStorage.getItem('hutd_best')) || 0; } catch (e) {}

    function reset() {
      player = { x: 60, y: GROUND - STAND_H, w: PLAYER_W, h: STAND_H, vy: 0, ducking: false, onGround: true };
      obstacles = [];
      speed = 6; distance = 0; nextGap = 300; score = 0;
      runAnimationTime = 0;
    }
    state = 'ready';
    reset();

    function start() {
      if (state === 'over') reset();
      state = 'play';
    }

    // =====================================
    // CONTROLS
    // =====================================
    function jump() {
      if (state !== 'play') { start(); return; }
      if (player.onGround && !player.ducking) {
        player.vy = -13;
        player.onGround = false;
      }
    }

    function duck(on) {
      if (state === 'play') player.ducking = on;
      else if (!on) player.ducking = false;
    }

    addEventListener('keydown', e => {
      if (['Space','ArrowUp','ArrowDown','KeyW','KeyS'].includes(e.code)) e.preventDefault();
      if (e.code === 'KeyH') { showHitboxes = !showHitboxes; return; }
      if (e.repeat) return;
      if (['Space','ArrowUp','KeyW'].includes(e.code)) jump();
      if (['ArrowDown','KeyS'].includes(e.code)) duck(true);
    });
    addEventListener('keyup', e => {
      if (['ArrowDown','KeyS'].includes(e.code)) duck(false);
    });

    const jb = document.getElementById('jumpBtn');
    const db = document.getElementById('duckBtn');
    jb.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
    db.addEventListener('pointerdown', e => { e.preventDefault(); duck(true); });
    ['pointerup','pointercancel','pointerleave'].forEach(ev => {
      db.addEventListener(ev, e => { e.preventDefault(); duck(false); });
    });
    cv.addEventListener('pointerdown', () => { if (state !== 'play') start(); });

    // =====================================
    // OBSTACLES
    // =====================================
    function spawn() {
      if (Math.random() < 0.65) {
        const emoji = ['🐛','💥','⚠️'][Math.floor(Math.random() * 3)];
        obstacles.push({
          type: 'ground', x: W + 20, y: GROUND - 65, w: 50, h: 65, emoji,
          variant: Math.floor(Math.random() * GROUND_OBS_FRAMES)
        });
      } else {
        // Wasp hitbox reaches into a standing Poyo but stays above a ducking one,
        // so you have to duck to get under it.
        const emoji = ['📡','☁️','🔥'][Math.floor(Math.random() * 3)];
        obstacles.push({ type:'air', x: W + 20, y: GROUND - 125, w: 60, h: 55, emoji });
      }
    }

    // =====================================
    // HITBOXES
    // =====================================
    function playerBox() {
      const p = player;
      return { x: p.x + PLAYER_INSET.x, y: p.y + PLAYER_INSET.top,
               w: p.w - PLAYER_INSET.x * 2, h: p.h - PLAYER_INSET.top - PLAYER_INSET.bottom };
    }
    function obstacleBox(o) {
      const i = o.type === 'air' ? AIR_INSET : OBS_INSET;
      return { x: o.x + i.x, y: o.y + i.top,
               w: o.w - i.x * 2, h: o.h - i.top - i.bottom };
    }

    // =====================================
    // UPDATE
    // =====================================
    function update(dt) {
      // Title screen: background drifts and little Poyo runs in place
      if (state === 'ready') {
        scrollPos += TITLE_SCROLL_SPEED * dt;
        runAnimationTime += dt * (1000 / 60);
        return;
      }
      if (state !== 'play') return;

      speed = Math.min(16, speed + 0.003 * dt);
      distance += speed * dt;
      scrollPos += speed * dt;
      score = Math.floor(distance / 10);
      animTime += dt * (1000 / 60);

      if (player.onGround && !player.ducking) {
        runAnimationTime += dt * (1000 / 60);
      }

      player.h = player.ducking && player.onGround ? DUCK_H : STAND_H;

      if (!player.onGround) {
        player.vy += 0.7 * dt;
        player.y += player.vy * dt;
        if (player.y >= GROUND - player.h) {
          player.y = GROUND - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      } else {
        player.y = GROUND - player.h;
      }

      nextGap -= speed * dt;
      if (nextGap <= 0) {
        spawn();
        nextGap = (300 + Math.random() * 260) * (0.8 + speed / 30);
      }

      obstacles.forEach(o => { o.x -= speed * dt; });
      obstacles = obstacles.filter(o => o.x + o.w > -10);

      const p = playerBox();
      for (const o of obstacles) {
        const q = obstacleBox(o);
        if (p.x < q.x + q.w && p.x + p.w > q.x &&
            p.y < q.y + q.h && p.y + p.h > q.y) {
          state = 'over';
          if (score > best) {
            best = score;
            try { localStorage.setItem('hutd_best', best); } catch (e) {}
          }
          break;
        }
      }
    }

    // =====================================
    // DRAWING
    // =====================================

    // Draw one frame of a sprite sheet, centered on cx, with its bottom at bottomY.
    function drawFrame(img, frames, frame, cx, bottomY, scale) {
      const fw = img.naturalWidth / frames;
      const fh = img.naturalHeight;
      const dw = fw * scale, dh = fh * scale;
      ctx.drawImage(img, frame * fw, 0, fw, fh, cx - dw / 2, bottomY - dh, dw, dh);
    }

    function drawBackground() {
      if (ready(art.bg)) {
        const w = art.bg.naturalWidth * (H / art.bg.naturalHeight);
        const offset = (scrollPos * BG_SPEED) % w;
        for (let x = -offset; x < W; x += w) ctx.drawImage(art.bg, x, 0, w, H);
      } else {
        // placeholder skyline so you can see the scrolling before the art exists
        const off = scrollPos * BG_SPEED;
        ctx.fillStyle = '#1d2748';
        for (let i = -1; i < 12; i++) {
          const bx = i * 90 - (off % 90);
          const bh = 60 + ((Math.floor(off / 90) + i + 100) * 37 % 70);
          ctx.fillRect(bx, GROUND - bh, 70, bh);
        }
      }
      if (BG_DIM > 0) {                        // dim the background only
        ctx.fillStyle = 'rgba(8, 10, 30, ' + BG_DIM + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawPlayer() {
      const p = player;

      if (!ready(art.run)) {                       // no art yet: orange box
        ctx.fillStyle = '#ff6a3d';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        return;
      }

      const cx = p.x + p.w / 2;
      const bottom = p.y + p.h;                    // feet on the ground
      const scale = SPRITE_HEIGHT / art.run.naturalHeight;
      const runFrame = Math.floor(runAnimationTime / RUN_FRAME_DURATION) % RUN_FRAMES;
      const isDucking = p.ducking && p.onGround;

      if (!p.onGround) {
        // JUMP
        if (ready(art.jump)) {
          let f = 0;
          if (JUMP_FRAMES > 1) {
            const t = (p.vy + 13) / 26;            // 0 = launching, 1 = falling fast
            f = Math.max(0, Math.min(JUMP_FRAMES - 1, Math.floor(t * JUMP_FRAMES)));
          }
          drawFrame(art.jump, JUMP_FRAMES, f, cx, bottom, scale);
        } else {
          drawFrame(art.run, RUN_FRAMES, runFrame, cx, bottom, scale);   // fallback
        }
      } else if (isDucking) {
        // CROUCH: squash the sprite so it visibly gets low
        const img = ready(art.crouch) ? art.crouch : art.run;
        const frames = ready(art.crouch) ? 1 : RUN_FRAMES;
        const f = ready(art.crouch) ? 0 : runFrame;
        const fw = img.naturalWidth / frames, fh = img.naturalHeight;
        const dw = fw * scale * CROUCH_STRETCH_X;
        const dh = fh * scale * CROUCH_SQUASH_Y;
        ctx.drawImage(img, f * fw, 0, fw, fh, cx - dw / 2, bottom - dh, dw, dh);
      } else {
        // RUN
        drawFrame(art.run, RUN_FRAMES, runFrame, cx, bottom, scale);
      }
    }

    function drawObstacle(o) {
      const cx = o.x + o.w / 2;

      if (o.type === 'air' && ready(art.hornet)) {
        const f = Math.floor(animTime / HORNET_FRAME_DURATION) % HORNET_FRAMES;
        const midY = o.y + o.h / 2 - HORNET_Y_NUDGE;   // centered on hitbox, nudged up
        const scale = HORNET_DRAW_HEIGHT / art.hornet.naturalHeight;
        drawFrame(art.hornet, HORNET_FRAMES, f, cx, midY + HORNET_DRAW_HEIGHT / 2, scale);
        return;
      }
      if (o.type === 'ground' && ready(art.ground)) {
        const f = GROUND_OBS_ANIMATED
          ? Math.floor(animTime / GROUND_FRAME_DURATION) % GROUND_OBS_FRAMES
          : o.variant;
        const scale = GROUND_OBS_DRAW_HEIGHT / art.ground.naturalHeight;
        drawFrame(art.ground, GROUND_OBS_FRAMES, f, cx, GROUND, scale);
        return;
      }
      // emoji fallback
      ctx.font = '46px serif';
      ctx.textBaseline = 'bottom';
      ctx.textAlign = 'left';
      ctx.fillText(o.emoji, o.x, o.y + o.h + 4);
    }

    function drawHitboxes() {
      ctx.lineWidth = 2;
      const p = playerBox();
      ctx.strokeStyle = 'red';
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = 'yellow';
      obstacles.forEach(o => {
        const q = obstacleBox(o);
        ctx.strokeRect(q.x, q.y, q.w, q.h);
      });
    }

    // ----- Title screen pieces -----
    function drawLogo() {
      if (!ready(art.logo)) {                      // no logo file: plain text title
        ctx.fillStyle = '#e8ecf8';
        ctx.font = 'bold 44px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(GAME_NAME, W / 2, 100);
        return;
      }
      // Draw the WHOLE image (no cropping). Its empty margins are black, so the
      // screen blend hides them, and anything past the canvas edge is clipped harmlessly.
      const iw = art.logo.naturalWidth, ih = art.logo.naturalHeight;
      const dw = LOGO_W, dh = LOGO_W * ih / iw;
      const y = LOGO_CENTER_Y - dh * LOGO_ART_CENTER;

      ctx.save();
      ctx.imageSmoothingEnabled = true;            // smooth when shrinking a big logo
      if (LOGO_BLEND_SCREEN) ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(art.logo, (W - dw) / 2, y, dw, dh);
      ctx.restore();
    }

    function drawTitlePoyo() {
      if (!ready(art.run)) return;
      const scale = TITLE_POYO_H / art.run.naturalHeight;
      const f = Math.floor(runAnimationTime / RUN_FRAME_DURATION) % RUN_FRAMES;
      drawFrame(art.run, RUN_FRAMES, f, TITLE_POYO_X, GROUND, scale);
    }

    function drawTitleText() {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      if (Math.floor(lastT / 500) % 2 === 0) {     // blinking prompt
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px monospace';
        ctx.fillText('PRESS JUMP TO START', W / 2, 212);
      }
      if (best > 0) {
        ctx.fillStyle = '#c9b8ff';
        ctx.font = '16px monospace';
        ctx.fillText('HIGH SCORE ' + String(best).padStart(5, '0'), W / 2, 238);
      }
      ctx.fillStyle = 'rgba(232, 236, 248, 0.6)';
      ctx.font = '13px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('HackUTD', W - 12, H - 10);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();

      if (state === 'ready') {
        ctx.fillStyle = 'rgba(8, 10, 30, 0.3)';    // extra dim so the logo pops
        ctx.fillRect(0, 0, W, H);
      }

      // ground line
      ctx.strokeStyle = '#3b4a7a';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

      // scrolling ground details
      ctx.fillStyle = '#3b4a7a';
      for (let i = 0; i < 20; i++) {
        const x = ((i * 60 - scrollPos) % W + W) % W;
        ctx.fillRect(x, GROUND + 8, 20, 2);
      }

      if (state === 'ready') {
        drawTitlePoyo();
        drawLogo();
        drawTitleText();
        return;
      }

      drawPlayer();
      obstacles.forEach(drawObstacle);
      if (showHitboxes) drawHitboxes();

      // score
      ctx.fillStyle = '#e8ecf8';
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('HI ' + String(best).padStart(5, '0') + '  ' + String(score).padStart(5, '0'), W - 12, 28);

      if (state === 'over') {
        ctx.textAlign = 'center';
        ctx.font = 'bold 34px sans-serif';
        ctx.fillText('GAME OVER', W / 2, 110);
        ctx.font = '18px sans-serif';
        ctx.fillText('Score ' + score + ' — press JUMP to restart', W / 2, 145);
      }
    }

    // =====================================
    // MAIN LOOP
    // =====================================
    function loop(t) {
      const dt = Math.min((t - lastT) / 16.67 || 1, 3);
      lastT = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
